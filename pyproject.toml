[project]
name = "aviation-temporal-demo"
version = "0.1.0"
description = "Verified RelationalAI temporal aviation demo"
requires-python = "==3.13.*"
dependencies = [
    "ipykernel==7.3.0",
    "jupyterlab==4.6.3",
    "matplotlib==3.11.1",
    "nbclient==0.11.0",
    "nbformat==5.11.1",
    "pandas==3.0.5",
    "plotly==7.0.0",
    "pyyaml==6.0.3",
    "relationalai==1.20.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
